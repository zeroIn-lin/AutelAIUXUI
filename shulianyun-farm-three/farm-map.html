<main id="farm-map-main">
  <header class="page-bar"><div><span>地图</span><span class="slash">/</span><strong>农场</strong></div><div class="map-layer-controls"><a id="google-original" href="https://www.google.com/maps/@44.5023,85.569,16z/data=!3m1!1e3" target="_blank" rel="noopener">Google 原图 ↗</a><select id="map-source-select" aria-label="地图底图"><option value="google">Google 卫星图</option><option value="snapshot">离线卫星图</option><option value="tianditu">天地图影像</option></select><button id="layer-settings" class="layer-button" hidden>设置 Key</button></div></header>
  <div class="map-layout">
    <div class="fm-inventory-rail"><button type="button" id="fm-inventory-toggle" aria-controls="fm-inventory" aria-expanded="false">地块与设备</button></div>
    <section class="inventory" id="fm-inventory" aria-label="地块与设备">
      <div class="fm-plot-filter"><label for="plot-filter">地块筛选</label>
        <select id="plot-filter"><option value="">全部地块</option></select>
      </div>
      <section class="fm-device-panel" aria-labelledby="device-heading">
        <div class="inventory-heading device-heading"><h2 id="device-heading">地块设备</h2><span id="device-count">4 台</span></div>
        <div id="device-list"></div>
      </section>
    </section>
    <section class="map-shell" aria-label="农场地图">
      <p id="fm-location-empty" role="status" hidden></p>
      <div id="map-view" tabindex="0" aria-label="农场地图，方向键平移，加减键缩放">
        <canvas id="map-drawing" aria-hidden="true"></canvas>
        <div id="tile-layer" aria-hidden="true"></div>
        <div id="google-viewport" hidden></div><canvas id="parcel-overlay" aria-hidden="true"></canvas>
        <div id="plot-label-layer"></div><div id="device-layer"></div>
      </div>
      <div class="map-source"><span class="source-dot"></span><strong id="base-label">加载底图</strong><span>地块与设备位置示意</span></div>
      <div class="fm-field-legend" aria-label="种植状态图例"><span><i class="fm-swatch-planted" aria-hidden="true"></i>已耕种</span><span><i class="fm-swatch-fallow" aria-hidden="true"></i>未耕种</span></div>
      <div class="compass" aria-label="正北向上"><b>N</b><i></i></div>
      <div class="map-tools"><button id="zoom-in" aria-label="放大地图" title="放大">＋</button><button id="zoom-out" aria-label="缩小地图" title="缩小">−</button><button id="reset-view" aria-label="定位地块" title="定位地块">◎</button></div>
      <div class="map-credit"><span id="scale"></span><a id="tdt-credit" href="https://www.tianditu.gov.cn/" target="_blank" rel="noopener" hidden>天地图 · 国家地理信息公共服务平台</a></div>
      <div id="map-status" role="status" hidden></div>
    </section>
  </div>
</main>
</div>
<dialog id="config-dialog"><form id="config-form"><header><h2>天地图影像</h2><button id="close-config" type="button" aria-label="关闭">×</button></header><label for="tdt-key">浏览器端 Key</label><input id="tdt-key" type="password" autocomplete="off" spellcheck="false" maxlength="64"><p id="key-note">密钥保存在当前浏览器，用于加载天地图影像。</p><div class="config-footer"><a href="https://console.tianditu.gov.cn/" target="_blank" rel="noopener">天地图控制台</a><button type="button" id="schematic">使用示意图</button><button class="primary" type="submit">加载影像</button></div></form></dialog>
</body></html>
