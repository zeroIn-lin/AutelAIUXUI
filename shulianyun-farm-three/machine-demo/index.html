/* V21 · 来自二代桩UX 2.0的浅色/深色语义色、圆角卡片与金属灰按钮 */
:root{color-scheme:light;--ui-bg:#ededf2;--ui-surface:#ffffff;--ui-raised:#f6f7fa;--ui-field:#f5f6f8;--ui-text:#111318;--ui-secondary:#59616c;--ui-line:#d8dce2;--ui-accent:#18a845;--ui-accent-text:#087731;--ui-accent-soft:#e8f6ed;--ui-button-top:#f9fbff;--ui-button-mid:#cbcdd1;--ui-button-bottom:#cfd0d4;--ui-button-edge:#b7bbc1;--ui-fault-bg:#e4e6eb;--ui-disabled:#dfe2e7;--ui-disabled-text:#78818b;--ui-warn-bg:#fff0e9;--ui-warn-text:#ad3c1e;--ui-warn-line:#e9c3b8;--ui-danger:#bb2929;--ui-danger-hover:#9e2424;--ui-primary-top:#16863d;--ui-primary-bottom:#096c2d;--ui-primary-text:#fff;--ui-frame:#cdd1d8;--ink:var(--ui-text);--muted:var(--ui-secondary);--line:var(--ui-line);--green:var(--ui-accent-text);--soft:var(--ui-accent-soft);--red:var(--ui-danger)}
:root[data-theme="dark"]{color-scheme:dark;--ui-bg:#121212;--ui-surface:#1e1e1e;--ui-raised:#272727;--ui-field:#161616;--ui-text:#f5f6f7;--ui-secondary:#b6bbc1;--ui-line:#414141;--ui-accent:#34c759;--ui-accent-text:#74e392;--ui-accent-soft:#183323;--ui-button-top:#4f4f4f;--ui-button-mid:#232323;--ui-button-bottom:#242424;--ui-button-edge:#707070;--ui-fault-bg:#242424;--ui-disabled:#303030;--ui-disabled-text:#959aa1;--ui-warn-bg:#3c211a;--ui-warn-text:#ffb29c;--ui-warn-line:#775047;--ui-danger:#c43737;--ui-danger-hover:#a82c2c;--ui-primary-top:#44d36a;--ui-primary-bottom:#30b952;--ui-primary-text:#06180b;--ui-frame:#080808;--red:#ff9992}
body{background:var(--ui-bg);color:var(--ui-text)}
.reviewbar,.note{background:var(--ui-surface);border-color:var(--ui-line)}
.reviewbar p,.reviewhelp,.note-page,.note dt,.note dd,.notes-heading small,.device-caption{color:var(--ui-secondary)}
.reviewbar button,.reviewbar select{background:var(--ui-raised);color:var(--ui-text);border-color:var(--ui-line)}
.note.selected{border-color:var(--ui-accent);background:var(--ui-accent-soft)}
.note button{color:var(--ui-text)}
.device-frame{background:var(--ui-frame);box-shadow:0 16px 40px #0000001a}
.viewport,.screen,.native-size,.native-size #device-viewer,.native-size #device-viewer:fullscreen{background:var(--ui-bg)}
.screen{color:var(--ui-text)}
.screen .top{background:var(--ui-bg);border-bottom:1px solid var(--ui-line);padding:0 30px;gap:24px}
.screen .brand{background:#1c3428;border-radius:16px;padding:4px 14px;gap:18px;flex-shrink:0}
.screen .brand .identity{color:#fff}
.screen .brand .identity small{color:#c0d2c4}
.screen .brand .library-logo{width:300px;height:77px}
.screen .topnav{gap:8px}
.screen .topnav button{background:transparent;color:var(--ui-secondary);font-size:22px;box-shadow:none}
.screen .topnav button.active{background:var(--ui-surface);color:var(--ui-text);box-shadow:0 1px 3px #00000012}
.screen .topright{color:var(--ui-text);gap:14px;flex-shrink:0}
.screen .topright .action-divider{background:var(--ui-line)}
.screen button:not(.pin){border-radius:12px;background:linear-gradient(180deg,var(--ui-button-top) 10%,var(--ui-button-mid) 90%,var(--ui-button-bottom));border:1px solid var(--ui-button-edge);color:var(--ui-text);box-shadow:inset 0 1px 0 #ffffff33,0 1px 2px #0000000c;font-weight:500}
.screen .topnav button{border:0;background:transparent;box-shadow:none}
.screen .topnav button.active{background:var(--ui-surface);color:var(--ui-text)}
.screen .theme-switch{display:flex;align-items:center;gap:8px;min-width:144px;min-height:52px;font-size:18px;padding:10px 14px;white-space:nowrap}
.theme-symbol{font-size:26px;line-height:1}
.screen .topright .lock-action{background:transparent;box-shadow:none;border-color:transparent;color:var(--ui-text);font-size:20px;padding:10px 12px}
.screen .primary:not(.pin){background:linear-gradient(180deg,var(--ui-primary-top),var(--ui-primary-bottom));color:var(--ui-primary-text);border-color:transparent;box-shadow:inset 0 1px 0 #ffffff22,0 2px 5px #00000014;font-weight:600}
.screen .danger:not(.pin){background:var(--ui-danger);border-color:var(--ui-danger);color:#fff;box-shadow:none}
.screen .danger:hover:not(:disabled){background:var(--ui-danger-hover)}
.screen button:focus-visible,.screen input:focus{outline-color:var(--ui-accent)}
.screen .machine-shell{background:transparent;border:0;box-shadow:none;border-radius:0}
.screen .machine-header{border-color:var(--ui-line);background:transparent}
.screen .machine-header .metric{border-color:var(--ui-line)}
.screen .machine-title,.screen .head h2,.screen .unit-heading h2{color:var(--ui-text)}
.screen .unit-heading h2,.screen .page-heading h2{font-size:28px;font-weight:600;line-height:1.3}
.screen .direct-cards .barrel,.screen .auto-mode .barrel,.screen .run-grid .barrel{background:var(--ui-surface);border:1px solid transparent;box-shadow:none;border-radius:28px 28px 28px 6px;color:var(--ui-text)}
.screen .direct-cards .barrel:nth-child(even),.screen .run-grid .barrel:nth-child(even){border-radius:28px 28px 6px 28px}
.screen .barrel.is-selected{border-color:var(--ui-accent);box-shadow:inset 0 0 0 1px var(--ui-accent)}
.screen .barrel.is-active{border-color:var(--ui-accent)}
.screen .barrel h3{font-size:28px;font-weight:600;line-height:1.3;color:var(--ui-text)}
.screen .barrel h3 strong{font-weight:700}
.screen .barrel.is-faulted,.screen .auto-mode .barrel.is-unavailable{background:var(--ui-fault-bg);border-color:transparent;box-shadow:none}
.screen .barrel .badge{background:var(--ui-raised);color:var(--ui-secondary);border-radius:8px}
.screen .barrel .badge.warn,.screen .badge.warn{background:var(--ui-warn-bg);color:var(--ui-warn-text)}
.screen .machine-body .reservoir-readout,.screen .machine-body .combined-reading .level-number{color:var(--ui-text)}
.screen .machine-body .combined-reading .level-number small,.screen .machine-body .combined-reading .volume-number,.screen .machine-body .combined-reading .volume-number small{color:var(--ui-secondary)}
.screen .combined-reading .level-number,.screen .run-actual strong,.screen .metric b,.screen input[type=number]{font-family:'D-DIN-PRO','DIN Alternate','Bahnschrift','Arial',sans-serif;font-variant-numeric:tabular-nums}
.screen .machine-body .auto-mode .combined-reading .level-number{font-size:58px;letter-spacing:-1px;font-weight:700}
.screen .reading-divider{color:var(--ui-secondary)}
.screen .barrel.is-faulted .has-fault,.screen .barrel .faultline.has-fault{background:var(--ui-warn-bg);border-color:var(--ui-warn-line);color:var(--ui-warn-text)}
.screen .faultline .fault-text,.screen .barrel.is-faulted .has-fault:after{color:var(--ui-warn-text)}
.screen .barrel-quantities,.screen .auto-mode .barrel-quantities,.screen .barrel-tools{border-color:var(--ui-line)}
.screen .auto-mode .plan-balance{color:var(--ui-secondary)!important;border-color:var(--ui-line)!important;background:transparent!important}
.screen input[type=number],.screen input.num,.screen .number-control input{background:var(--ui-field);border-color:var(--ui-line);color:var(--ui-text)}
.screen input[type=checkbox]{accent-color:var(--ui-accent)}
.screen input:disabled{background:var(--ui-disabled);color:var(--ui-disabled-text)}
.screen .auto-quantity label,.screen .task-setting>label{color:var(--ui-text)}
.screen .unit,.screen .task-setting label span,.screen .op-hint,.screen .eyebrow,.screen .subtle,.screen .muted{color:var(--ui-secondary)}
.screen .auto-mode .quick-amount{background:var(--ui-raised);border-color:var(--ui-line);color:var(--ui-text);box-shadow:none}
.screen .auto-mode .quick-value{color:var(--ui-secondary)}
.screen .auto-mode .quick-amount.chosen{background:var(--ui-accent-soft);border-color:var(--ui-accent);color:var(--ui-accent-text);box-shadow:inset 0 0 0 1px var(--ui-accent)}
.screen .auto-mode .quick-amount.chosen .quick-value{color:var(--ui-accent-text)}
.screen .auto-mode .quick-amount:disabled{background:var(--ui-raised);color:var(--ui-disabled-text);border-color:var(--ui-line);opacity:.55}
.screen .barrel.is-faulted .direct-ops button:disabled,.screen .barrel.is-faulted .barrel-tools button:disabled{background:var(--ui-disabled);border-color:var(--ui-line);color:var(--ui-disabled-text)}
.screen .auto-console,.screen .task-settings{background:transparent;border:0;box-shadow:none}
.screen .auto-console .task-setting{background:var(--ui-surface);border-color:transparent;border-radius:16px}
.screen .task-settings .check{color:var(--ui-text)}
.screen .task-settings .error-text,.screen .error-text{color:var(--red)}
.screen .panel,.screen .settings-dialog,.screen .touch-keyboard{background:var(--ui-surface);color:var(--ui-text);border-color:var(--ui-line);box-shadow:0 22px 70px #00000025;border-radius:24px}
.screen .settings-dialog .head,.screen .dialog-rule-row{border-color:var(--ui-line)}
.screen .settings-dialog .head h2,.screen .settings-dialog .check{color:var(--ui-text)}
.screen .settings-dialog .close{background:var(--ui-raised);border-color:var(--ui-line);color:var(--ui-text);box-shadow:none}
.screen .overlay{background:#00000066;backdrop-filter:blur(4px)}
.screen .notice{background:var(--ui-warn-bg);color:var(--ui-warn-text);border-color:var(--ui-warn-line)}
.screen .touch-keyboard .key-grid button{background:linear-gradient(180deg,var(--ui-button-top),var(--ui-button-bottom));color:var(--ui-text);border-color:var(--ui-button-edge)}
.screen .touch-keyboard .key-value{background:var(--ui-field);color:var(--ui-text);border-color:var(--ui-accent);box-shadow:none}
.screen .touch-keyboard .key-value.replace-selected,.screen .keypad-open-input{background:var(--ui-accent-soft)!important;color:var(--ui-accent-text);border-color:var(--ui-accent)}
.screen .touch-keyboard .key-range{color:var(--ui-secondary)}
.screen .touch-keyboard .key-edit-state{color:var(--ui-accent-text)}
.screen .touch-keyboard .key-error{color:var(--red)}
.screen .run-timeline{background:var(--ui-surface);border-color:transparent;border-radius:20px}
.screen .steps span,.screen .run-time{color:var(--ui-secondary)}
.screen .steps .current,.screen .current-phase{color:var(--ui-accent-text)}
.screen .progress{background:var(--ui-line)}
.screen .progress i{background:var(--ui-accent)}
.screen .run-actual{color:var(--ui-secondary)}
.screen .run-actual strong{color:var(--ui-text)}
.screen .data-row,.screen .table th,.screen .table td{border-color:var(--ui-line);color:var(--ui-text)}
.screen .table th{background:var(--ui-raised)}
.screen .result-icon{background:var(--ui-accent-soft);color:var(--ui-accent-text)}
.screen .locked-banner{background:var(--ui-warn-bg);color:var(--ui-warn-text);border-color:var(--ui-warn-line)}
.screen .toast{background:var(--ui-text);color:var(--ui-bg)}
:root[data-theme="dark"] .screen .tank3d:not([data-sensor="false"]){filter:brightness(.9) saturate(.9)}
@media(prefers-reduced-motion:no-preference){.screen .theme-switch{transition:background .15s ease,color .15s ease}}

/* 清除旧样式的硬编码白色，保证两种主题的可读性 */
.screen .topright>button.lock-action{color:var(--ui-text);background:transparent;border-color:transparent}
.screen .topright>button.theme-switch{color:var(--ui-text);background:linear-gradient(180deg,var(--ui-button-top) 10%,var(--ui-button-mid) 90%,var(--ui-button-bottom));border-color:var(--ui-button-edge);position:relative;z-index:30}
.screen .page-actions>[data-select-available],.screen .auto-console .flow-setting .presets button{background:linear-gradient(180deg,var(--ui-button-top) 10%,var(--ui-button-mid) 90%,var(--ui-button-bottom));color:var(--ui-text);border-color:var(--ui-button-edge)}
.screen .barrel .faultline.has-fault{background:var(--ui-warn-bg)!important;border-color:var(--ui-warn-line)!important;color:var(--ui-warn-text)!important}

.screen .topright>button.lock-action{color:var(--ui-text)!important}
.screen .theme-switch{transition:none}

.screen .stop-all:not(:disabled){background:var(--ui-warn-bg);color:var(--ui-warn-text);border-color:var(--ui-warn-line)}

.screen .machine-header .eyebrow{color:var(--ui-secondary)}
.screen .stop-all:disabled{background:var(--ui-disabled);border-color:var(--ui-line);color:var(--ui-disabled-text);opacity:.6;box-shadow:none}

/* V22 · 底部功能导航，顶部暂不展示品牌Logo */
.screen .top{height:64px;min-height:64px;padding:0 36px;border:0;gap:24px}
.screen .brand{background:transparent;padding:0;border-radius:0}
.screen .brand .identity{border:0;padding:0;color:var(--ui-text);gap:10px}
.screen .brand .identity small{color:var(--ui-secondary);font-size:14px}
.screen .brand .identity b{color:var(--ui-text);font-size:21px;line-height:1.2}
.screen .brand .identity-avatar{width:38px;height:38px;background:var(--ui-surface);border-color:var(--ui-line);color:var(--ui-secondary);font-size:18px}
.screen .topright .theme-switch,.screen .topright .lock-action{min-height:48px;padding-top:8px;padding-bottom:8px}
.screen .topright .danger{min-height:48px;padding:9px 24px;font-size:23px}
.bottom-navigation{height:80px;min-height:80px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 32px;background:var(--ui-bg);border-top:1px solid var(--ui-line)}
.screen .bottom-navigation button{width:176px;min-height:56px;font-size:23px;line-height:1.2;border-radius:12px}
.screen .bottom-navigation button.active{background:var(--ui-accent-soft);border-color:var(--ui-accent);color:var(--ui-accent-text);font-weight:600;box-shadow:inset 0 0 0 1px var(--ui-accent)}
.screen .machine-body .direct-cards:not(.auto-mode) .compact-visual,.screen .machine-body .direct-cards:not(.auto-mode) .barrel-illustration,.screen .machine-body .direct-cards:not(.auto-mode) .tank.tank3d{height:176px;min-height:176px}
.screen .machine-body .direct-cards:not(.auto-mode) .barrel-illustration .tank-model{transform:scale(.72);top:4px;left:5px}
.screen .direct-cards:not(.auto-mode)>.barrel{gap:8px}

.screen .run-grid .run-card{padding:20px 26px;gap:10px;min-height:0}
.screen .machine-body .run-grid .run-card .compact-visual,.screen .machine-body .run-grid .run-card .barrel-illustration,.screen .machine-body .run-grid .run-card .tank.tank3d{height:176px;min-height:176px}
.screen .machine-body .run-grid .run-card .barrel-illustration .tank-model{transform:scale(.72);top:4px;left:5px}

/* V23 · 顶部导航与原Logo恢复；全局底色保持中性灰 */
.screen .top{height:104px;min-height:104px;padding:0 30px;background:var(--ui-bg);border-bottom:1px solid var(--ui-line)}
.screen .brand{gap:20px;background:transparent;padding:0;flex-shrink:0}
.logo-plate{display:flex;align-items:center;justify-content:center;padding:6px 12px;background:#27282c;border-radius:14px;flex-shrink:0}
.screen .brand .library-logo{display:block;width:300px;height:77px}
.screen .brand .identity{background:transparent;color:var(--ui-text)}
.screen .topnav{display:flex;align-items:center;gap:8px}
.screen .topnav button{min-height:56px;min-width:82px;padding:12px 18px;background:transparent;border:0;box-shadow:none;color:var(--ui-secondary);font-size:23px}
.screen .topnav button.active{background:var(--ui-surface);border:1px solid var(--ui-line);color:var(--ui-text);box-shadow:0 1px 2px #0000000c;font-weight:600}

/* V24 · 灰底白色内容卡、图标Tab、右下角急停 */
.screen .top{height:88px;min-height:88px}
.logo-plate{padding:0;background:transparent;border-radius:0}
.screen .library-logo{color:var(--ui-text);display:block;width:300px;height:77px}
.library-logo>svg{display:block}
.screen .brand{gap:18px}
.screen .user-button{width:56px;height:56px;min-width:56px;display:grid;place-items:center;padding:12px}
.screen .user-button .ui-icon{width:28px;height:28px}
.screen .topnav{gap:12px}
.screen .topnav button{display:flex;align-items:center;justify-content:center;gap:10px;min-width:122px;min-height:56px;padding:12px 18px;background:linear-gradient(180deg,var(--ui-button-top) 10%,var(--ui-button-mid) 90%,var(--ui-button-bottom));border:1px solid var(--ui-button-edge);box-shadow:inset 0 1px 0 #ffffff33;color:var(--ui-text)}
.screen .topnav button.active{background:linear-gradient(180deg,var(--ui-button-top) 10%,var(--ui-button-mid) 90%,var(--ui-button-bottom));border-color:var(--ui-accent);box-shadow:inset 0 0 0 1px var(--ui-accent);color:var(--ui-accent-text)}
.screen .machine-shell{background:var(--ui-surface);border-radius:24px;border:1px solid var(--ui-line);padding:20px}
.screen .direct-cards .barrel,.screen .auto-mode .barrel,.screen .run-grid .barrel{border-color:var(--ui-line)}
.screen .barrel.is-selected{border-color:var(--ui-accent)}
.screen .topright{gap:16px}
.connection-status{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--ui-text);white-space:nowrap}
.connection-status>.ui-icon{color:var(--ui-accent-text);width:24px;height:24px}
.connection-status small{font-size:14px;color:var(--ui-secondary);padding:3px 6px;border:1px solid var(--ui-line);border-radius:5px}
.connection-status.offline>.ui-icon,.connection-status.offline>span{color:var(--ui-warn-text)}
.device-footer{height:76px;min-height:76px;flex-shrink:0;display:flex;justify-content:flex-end;align-items:center;padding:8px 36px;background:var(--ui-bg);position:relative;z-index:110}
.screen .estop-button{min-width:220px;min-height:60px;font-size:27px;display:flex;align-items:center;justify-content:center;gap:14px;border-radius:12px;font-weight:600}
.estop-square{width:18px;height:18px;background:currentColor;border-radius:2px}
.screen .touch-keyboard{bottom:100px}
.screen .toast{bottom:100px}
.user-profile-card{display:flex;align-items:center;justify-content:center;gap:22px;padding:30px;font-size:32px}
.user-profile-card .ui-icon{width:48px;height:48px;color:var(--ui-accent-text)}
.screen .machine-body .direct-cards:not(.auto-mode) .compact-visual,.screen .machine-body .direct-cards:not(.auto-mode) .barrel-illustration,.screen .machine-body .direct-cards:not(.auto-mode) .tank.tank3d{height:156px;min-height:156px}
.screen .machine-body .direct-cards:not(.auto-mode) .barrel-illustration .tank-model{transform:scale(.64);top:4px;left:5px}
.screen .machine-body .auto-mode .compact-visual,.screen .machine-body .auto-mode .barrel-illustration,.screen .machine-body .auto-mode .tank.tank3d{height:210px;min-height:210px}
.screen .machine-body .auto-mode .barrel-illustration .tank-model{transform:scale(.87);top:4px;left:16px}
.screen .machine-body .run-grid .run-card .compact-visual,.screen .machine-body .run-grid .run-card .barrel-illustration,.screen .machine-body .run-grid .run-card .tank.tank3d{height:156px;min-height:156px}
.screen .machine-body .run-grid .run-card .barrel-illustration .tank-model{transform:scale(.64);top:4px;left:5px}

/* 原参考Wi-Fi组件；仅保留业务状态图标 */
.connection-status{min-width:28px;width:28px;height:28px;display:flex;justify-content:center;align-items:center;gap:0}
.wifi-glyph{position:relative;display:block;width:28px;height:28px}
.wifi-glyph img{position:absolute;left:4px;top:4px;display:block;transform:scale(1.4);transform-origin:center}
.wifi-glyph .wifi-dark{display:none}
:root[data-theme="dark"] .wifi-glyph .wifi-light{display:none}
:root[data-theme="dark"] .wifi-glyph .wifi-dark{display:block}
.wifi-disconnected{position:absolute;right:0;bottom:1px;width:14px;height:14px;border-radius:50%;background:#b8322b;color:white;border:1px solid var(--ui-bg);font:600 14px/12px Arial,sans-serif;text-align:center}

/* V26 · 顶部工具统一为灰色渐变图标按钮 */
.screen .topright>button.theme-switch,.screen .topright>button.lock-action{display:grid;place-items:center;gap:0;width:56px;height:56px;min-width:56px;min-height:56px;padding:13px;background:linear-gradient(180deg,var(--ui-button-top) 10%,var(--ui-button-mid) 90%,var(--ui-button-bottom));border:1px solid var(--ui-button-edge)!important;color:var(--ui-text)!important;border-radius:12px;box-shadow:inset 0 1px 0 #ffffff33,0 1px 2px #0000000c}
.screen .topright>button.theme-switch .ui-icon,.screen .topright>button.lock-action .ui-icon{display:block;width:28px;height:28px}
.screen .auto-mode .barrel:not(.is-unavailable){cursor:pointer}
.screen .touch-keyboard .key-value{text-align:right;display:block}
.screen .touch-keyboard .key-value::placeholder{font-size:20px;color:var(--ui-secondary);opacity:1}
.screen .touch-keyboard.has-error .key-value{border-color:var(--red);color:var(--red);background:var(--ui-warn-bg)!important;box-shadow:inset 0 0 0 1px var(--red)}
.screen .touch-keyboard .key-error{color:var(--red)}
/* V28 · 头部留白与右侧账户入口 */
.screen .top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:32px;padding:12px 36px;height:96px;min-height:96px;align-items:center}
.screen .brand{justify-self:start;min-width:0}
.screen .brand .library-logo{width:252px;height:64.68px}
.screen .topnav{justify-self:center}
.screen .topright{justify-self:end;display:flex;align-items:center;gap:16px}
.screen .topright>button.user-button{background:linear-gradient(180deg,var(--ui-button-top) 10%,var(--ui-button-mid) 90%,var(--ui-button-bottom));border:1px solid var(--ui-button-edge);color:var(--ui-text);box-shadow:inset 0 1px 0 #ffffff33,0 1px 2px #0000000c}
/* V29 · 清晰运行状态、完整圆角描边与轻量禁用态 */

}
#screen .unlock-tabs button { padding-inline: 22px; font-size: 21px; }
#screen .unlock-tabs button[aria-pressed="true"] {
  border-color: var(--ui-accent);
  background: var(--ui-accent-soft);
  color: var(--ui-accent-text);
  font-weight: 650;
}
#screen .unlock-header .close {
  display: grid;
  place-items: center;
  padding: 0;
  background: var(--ui-raised);
  border-color: var(--ui-line);
  color: var(--ui-secondary);
  box-shadow: none;
  font-size: 30px;
}
#screen .unlock-form { display: grid; gap: 18px; margin: 0; padding-top: 24px; }
.unlock-fields { display: grid; gap: 14px; }
.unlock-field {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 64px;
  padding-inline: 18px;
  border: 1px solid var(--ui-button-edge);
  border-radius: 12px;
  background: var(--ui-field);
}
.unlock-field svg { width: 26px; height: 26px; flex-shrink: 0; color: var(--ui-secondary); }
#screen .unlock-field input {
  flex: 1;
  min-width: 0;
  height: 60px;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ui-text);
  font-size: 22px;
}
#screen .unlock-field input::placeholder { color: var(--ui-secondary); opacity: 1; }
.unlock-field:focus-within { border-color: var(--ui-accent-text); box-shadow: 0 0 0 1px var(--ui-accent-text); }
.unlock-field:has([aria-invalid="true"]) { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.unlock-prompt { margin: 0; text-align: center; color: var(--ui-secondary); font-size: 21px; }
#screen .pattern-board {
  position: relative;
  isolation: isolate;
  display: grid;
  place-items: center;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  width: min(300px, 100%);
  aspect-ratio: 1;
  justify-self: center;
  padding: 0;
  touch-action: none;
  user-select: none;
}
#screen .pattern-board[aria-invalid="true"] { border-radius: 16px; box-shadow: 0 0 0 2px var(--red); }
.pattern-lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  color: var(--ui-accent);
  pointer-events: none;
}
#screen .pattern-board .pattern-dot {
  z-index: 1;
  display: grid;
  place-items: center;
  width: var(--button-medium);
  height: var(--button-medium);
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  box-shadow: none;
  color: var(--ui-secondary);
}
#screen .pattern-dot::before {
  content: '';
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: currentColor;
}
#screen .pattern-board .pattern-dot[aria-pressed="true"] {
  background: color-mix(in srgb, var(--ui-accent) 14%, transparent);
  color: var(--ui-accent-text);
}
#screen .pattern-board .pattern-dot:focus-visible { outline: 2px solid var(--ui-accent-text); outline-offset: 0; }
.unlock-tools, .unlock-actions { justify-content: center; }
#screen .unlock-tools button { min-width: 130px; font-size: 20px; }
#screen .unlock-actions { border-top: 1px solid var(--ui-line); padding-top: 20px; }
#screen .unlock-actions button { min-width: 168px; font-size: 22px; }
#screen .unlock-error { margin: 0; color: var(--red); font-size: 20px; line-height: 1.45; }
#screen .unlock-error:empty { display: none; }
#screen .lock-confirm .head { justify-content: center; padding: 0; border: 0; }
#screen .lock-confirm .head h2 { margin: 0; color: var(--ui-text); font-size: 30px; }
#screen .lock-confirm .dialog-body { padding-block: 20px 24px; text-align: center; color: var(--ui-secondary); font-size: 23px; }
#screen .lock-confirm .dialog-body p { margin: 0; }
#screen .lock-confirm .actions { justify-content: center; gap: 16px; margin: 0; padding: 0; border: 0; }
#screen .dialog.lock-confirm .actions button { --button-height: var(--button-medium); min-width: 160px; font-size: 22px; }

#screen .lock-confirm .close { display: none; }
#screen:has(.lock-layer) #toast { z-index: 120; }

function themeButtonHTML(){return uiIcon(colorTheme==='dark'?'sun':'moon');}
function updateThemeButton(){const button=$('[data-action="theme-toggle"]');if(button){button.innerHTML=themeButtonHTML();button.setAttribute('aria-pressed',String(colorTheme==='dark'));button.setAttribute('aria-label','切换至'+(colorTheme==='dark'?'浅色模式':'暗夜模式'));}}

      const center=patternCenter(id);
      const t=lengthSquared?Math.min(1,Math.max(0,((center.x-from.x)*dx+(center.y-from.y)*dy)/lengthSquared)):0;
      if(Math.hypot(center.x-from.x-dx*t,center.y-from.y-dy*t)<=30)hits.push({id,t});
    }
    hits.sort((a,b)=>a.t-b.t);
    for(const hit of hits)lockUI.points.push(hit.id);
  }

  function addTap(id){
    if(lockUI.points.includes(id))return;
    const to=patternCenter(id);
    traverse(lockUI.points.length?patternCenter(lockUI.points[lockUI.points.length-1]):to,to);
  }

  board.addEventListener('pointerdown',event=>{
    if(gesture || !event.isPrimary || event.button!==0)return;
    const at=location(event);
    const start=buttons.find(button=>{
      const center=patternCenter(Number(button.dataset.point));
      return Math.hypot(center.x-at.x,center.y-at.y)<=30;
    });
    if(!start)return;
    event.preventDefault();
    board.setPointerCapture(event.pointerId);
    start.focus({preventScroll:true});
    clearUnlockError();
    const startId=Number(start.dataset.point);
    gesture={pointer:event.pointerId,start:at,last:at,startId,dragging:false,previous:lockUI.points.slice()};
    addTap(startId);
    paint();
  });

  function advance(event){
    const at=location(event);
    if(!gesture.dragging){
      if(Math.hypot(at.x-gesture.start.x,at.y-gesture.start.y)<7)return;
      gesture.dragging=true;
      lockUI.points=[gesture.startId];
    }
    traverse(gesture.last,at);
    gesture.last=at;
  }

  board.addEventListener('pointermove',event=>{
    if(gesture?.pointer!==event.pointerId)return;
    for(const sample of event.getCoalescedEvents?.()||[])advance(sample);
    advance(event);
    if(gesture.dragging)paint(gesture.last);
  });

  board.addEventListener('pointerup',event=>{
    if(gesture?.pointer!==event.pointerId)return;
    advance(event);
    gesture=null;
    paint();
  });

  function cancel(event){
    if(gesture?.pointer!==event.pointerId)return;
    lockUI.points=gesture.previous;
    gesture=null;
    paint();
  }
  board.addEventListener('pointercancel',cancel);
  board.addEventListener('lostpointercapture',cancel);

  board.addEventListener('click',event=>{
    const button=event.target.closest('.pattern-dot');
    if(!button || event.detail!==0 || gesture)return;
    clearUnlockError();
    addTap(Number(button.dataset.point));
    paint();
  });
}

const lockAccount='张三', initialPattern='126'; let lockPassword='246810';
const patternKey='fert-ux-pattern-zhangsan-v1', lockSessionKey='fert-ux-screen-locked';
const lockUI={view:'covered', points:[], pendingPattern:''};
let unlockPattern=initialPattern;
try{

function lockLayerHTML(){
  if(lockUI.view==='covered')return `<button class="lock-entry" data-action="screen-unlock"><span class="lock-emblem">${uiIcon('lock')}</span><span>点击解锁</span></button>`;
  const view=lockUI.view, account=view==='account', password=view==='verify-password';
  const prompts={pattern:'请绘制解锁图形', 'verify-pattern':'请绘制当前图形', 'verify-password':'请输入当前账号密码以重置图形', new:'请绘制新图形，至少连接 3 个点', repeat:'请再次绘制新图形'};

function syncLockLayer(){
  if(!state.lockedScreen || state.modal?.type==='confirm-estop')return;
  let layer=$('.lock-layer');
  if(!layer){
    layer=document.createElement('div');
    layer.className='lock-layer';
    $('#screen').appendChild(layer);
  }
  if(layer.dataset.view===lockUI.view)return;
  layer.dataset.view=lockUI.view;
  layer.innerHTML=lockLayerHTML();
  attachPatternInput(layer.querySelector('.pattern-board'));

}

function setUnlockView(view){
  if(lockUI.view===view)return;
  lockUI.view=view;
  lockUI.points=[];

}

function clearUnlockError(){
  const error=$('#unlock-error');
  if(error)error.textContent='';
  document.querySelectorAll('.unlock-form [aria-invalid="true"]').forEach(field=>field.removeAttribute('aria-invalid'));
}

function unlockError(text,fields){
  $('#unlock-error').textContent=text;
  for(const field of fields)field.setAttribute('aria-invalid','true');
  fields[0]?.focus({preventScroll:true});
}

function submitUnlock(){
  if(!state.lockedScreen || state.modal || lockUI.view==='covered')return;
  clearUnlockError();
  const view=lockUI.view;
  if(view==='account'||view==='verify-password'){
    const password=$('#unlock-password'),account=$('#unlock-account');
    if(account&&!account.value.trim())return unlockError('请输入账号',[account]);
    if(!password.value)return unlockError('请输入密码',[password]);
    if((account&&account.value.trim()!==lockAccount)||password.value!==lockPassword){
      password.value='';
      return unlockError(account?'账号或密码不正确':'密码不正确',account?[password,account]:[password]);
    }
    if(view==='account')setScreenLocked(false);else setUnlockView('new');
    return;
  }
  const points=lockUI.points.join('');
  let error='';
  if(points.length<3)error='请至少连接 3 个点';
  else if((view==='pattern'||view==='verify-pattern')&&points!==unlockPattern)error='图形不正确，请重新绘制';
  else if(view==='repeat'&&points!==lockUI.pendingPattern)error='两次图形不一致，请重试';
  if(error){
    lockUI.points=[];
    const board=$('.pattern-board');
    board.outerHTML=patternBoardHTML();
    attachPatternInput($('.pattern-board'));
    unlockError(error,[$('.pattern-board')]);
    $('.pattern-dot').focus({preventScroll:true});
    return;
  }
  if(view==='pattern')setScreenLocked(false);
  else if(view==='verify-pattern')setUnlockView('new');
  else if(view==='new'){lockUI.pendingPattern=points;setUnlockView('repeat');}
  else if(view==='repeat'){
    unlockPattern=points;
    try{localStorage.setItem(patternKey,points);}catch{}
    setUnlockView('pattern');
    toast('新图形已保存');
  }
}

function handleLockAction(action,kind){
  if(action==='screen-lock'){
    if(!state.lockedScreen){state.modal={type:'confirm-lock'};render();}
    return true;
  }
  if(action==='confirm-screen-lock'){
    if(state.modal?.type==='confirm-lock')setScreenLocked(true);
    return true;
  }
  if(!state.lockedScreen)return false;
  if(action==='estop'){setUnlockView('covered');return false;}
  if(state.modal?.type==='confirm-estop')return !['confirm-estop','close'].includes(action);
  if(action==='screen-unlock'&&lockUI.view==='covered')setUnlockView('account');
  else if(action==='unlock-close')setUnlockView('covered');
  else if(action==='unlock-tab'&&lockUI.view!=='covered'&&['account','pattern'].includes(kind))setUnlockView(kind);
  else if(action==='unlock-forgot'&&lockUI.view==='pattern')setUnlockView('verify-password');
  else if(action==='unlock-change'&&lockUI.view==='pattern')setUnlockView('verify-pattern');
  return true;
}

// Update the device behind the mask without detaching a live input or captured pointer.
function paintDeviceScreen(){
  const screen=$('#screen');
  const layer=state.lockedScreen && state.modal?.type!=='confirm-estop' && screen.querySelector('.lock-layer');
  if(layer){
    const template=document.createElement('template');
    template.innerHTML=screenHTML();
    const toastNode=screen.querySelector('#toast');
    if(toastNode)template.content.querySelector('#toast').remove();
    for(const node of [...screen.childNodes])if(node!==layer&&node!==toastNode)node.remove();
    layer.before(template.content);
  }else {
    const loginPage = screen.querySelector('.login-page');
    const operations = screen.querySelector('.operation-table-wrap');
    const tableScroll = operations && {top:operations.scrollTop,left:operations.scrollLeft};
    screen.innerHTML=screenHTML();
    if(tableScroll)screen.querySelector('.operation-table-wrap')?.scrollTo(tableScroll);
    if (loginPage) {
      screen.querySelector('.top')?.setAttribute('inert','');
      screen.querySelector('.main')?.setAttribute('inert','');
      screen.append(loginPage);
    }
  }
}

function updateAmountQuickUI(){if(state.page!=='setup')return;for(const b of state.barrels){const d=state.draft[b.id];if(!d)continue;const balance=$('[data-plan-balance="'+b.id+'"]');if(balance)balance.textContent=planBalanceText(b);const inject=$('#inject-'+b.id);if(inject)inject.max=Number.isFinite(d.target)?Math.max(0,d.target-minLiters(b)):0;for(const key of ['target','inject'])for(const [i,o]of amountOptions(b,key).entries()){const el=document.querySelector('[data-quick-id="'+b.id+'"][data-quick-key="'+key+'"][data-quick-index="'+i+'"]');if(!el)continue;el.disabled=!!o.reason;el.classList.toggle('chosen',o.selected&&!o.reason);el.setAttribute('aria-pressed',String(o.selected&&!o.reason));el.title=o.reason||o.label+' '+f(o.value)+' L';el.setAttribute('aria-label','肥料桶 '+b.id+' '+(key==='target'?'配液':'注入')+' '+o.label+' '+f(o.value)+'升');el.querySelector('.quick-value').textContent=autoAvailable(b)?f(o.value)+' L':'—';}const marker=document.querySelector('.barrel[data-barrel="'+b.id+'"] .target-marker');if(marker){const valid=Number.isFinite(d.target)&&d.target>=0&&d.target<=b.cap;marker.hidden=!valid;marker.style.top=(47+148-(valid?d.target:0)/b.cap*148-9)+'px';marker.dataset.targetLiters=valid?d.target:'';}}const toggle=$('[data-select-available]');if(toggle){const available=setupBarrels().filter(autoAvailable);toggle.textContent=available.length&&available.every(b=>state.selected.includes(b.id))?'取消全选':'全选可用桶';toggle.disabled=!available.length;}}

function setupDraftError(){if(!state.selected.length)return '请选择至少一个肥料桶';if(!Number.isFinite(state.flow)||state.flow<1200||state.flow>2400)return '施肥速度须在 1200–2400 L/h';if(!Number.isFinite(state.mixMinutes)||state.mixMinutes<0||state.mixMinutes>60)return '搅拌时长须在 0–60 分钟';if(state.wash&&(!Number.isFinite(state.washMinutes)||state.washMinutes<1||state.washMinutes>20))return '清洗时长须在 1–20 分钟';for(const id of state.selected){const e=validDraft(id,state.draft[id]);if(e)return '肥料桶 '+id+'：'+e;}return '';}

function estimateParts(){const bs=state.selected.map(id=>({b:barrel(id),d:state.draft[id]})).filter(x=>x.d);return [bs.reduce((s,{b,d})=>s+Math.max(0,d.target-b.lv*b.cap/100),0)/state.flow*60,state.mixMinutes,bs.reduce((sum,{b,d})=>sum+automaticInjection(b,d.target),0)/state.flow*60,state.wash?state.washMinutes:0];}
function stageProgressHTML(job){
  const stages=['fill','mix','fert','wash'];
  const durations=[
    job.items.reduce((sum,item)=>sum+item.waterNeed,0)/job.flow*60,
    job.mixMinutes,
    job.items.reduce((sum,item)=>sum+item.inject,0)/job.flow*60,
    job.wash?job.washMinutes:0
  ];
  return `<ol class="stage-progress" aria-label="任务阶段">${stages.map((stage,index)=>{
    const current=job.stage===stage;
    const skipped=!current&&durations[index]===0;
    const completed=!skipped&&job.completedStages.includes(stage);
    const fraction=current&&durations[index]>0?Math.max(0,Math.min(1,1-stageRemaining()/durations[index])):completed?1:0;
    const status=current?'进行中':skipped?'跳过':completed?'已完成':'未开始';
    return `<li data-status="${status}" ${current?'aria-current="step"':''}>
      <span class="stage-node" aria-hidden="true">${completed?'✓':index+1}</span>
      <div class="stage-text"><strong>${stageLabel(stage)}</strong><small>${status}</small></div>
      <div class="stage-track" aria-hidden="true"><i style="width:${fraction*100}%"></i></div>
    </li>`;
  }).join('')}</ol>`;
}

      <div class="result-barrels">${j.items.map(item=>`

function animateRunReadings(previous){
  for(const reading of document.querySelectorAll('#screen [data-reading]')){
    const target = reading.textContent;
    const displayed = previous.get(reading.dataset.reading);
    if(displayed === undefined || displayed === target) continue;

    const start = Number(displayed.replaceAll(',', ''));
    const end = Number(target.replaceAll(',', ''));
    if(!Number.isFinite(start) || !Number.isFinite(end)) continue;

    const wholeNumbers = Number.isInteger(start) && Number.isInteger(end);
    const duration = 300;
    const startedAt = performance.now();
    reading.textContent = displayed;

    function count(now){
      if(!reading.isConnected) return;
      const progress = Math.min(1, (now - startedAt) / duration);
      if(progress >= 1){
        reading.textContent = target;
        return;
      }
      const value = start + (end - start) * progress;
      reading.textContent = f(wholeNumbers ? Math.round(value) : value);
      requestAnimationFrame(count);
    }
    requestAnimationFrame(count);
  }
}

function tickJob(minutes){let left=minutes;for(let loop=0;loop<8&&left>1e-8&&activeJob();loop++){skipEmptyStages();if(!activeJob())break;const j=state.job;if(j.items.some(it=>!barrel(it.id).sensor||barrel(it.id).fault)){finishJob('fault','设备故障，任务已中断');break;}const dt=Math.min(left,stageRemaining());if(j.stage==='fill')distribute(j.flow/60*dt,j.items,it=>it.waterNeed-it.waterActual,(it,v)=>{it.waterActual+=v;barrel(it.id).lv+=v/barrel(it.id).cap*100;barrel(it.id).water=it.waterNeed-it.waterActual>1e-6;});if(j.stage==='fert')distribute(j.flow/60*dt,j.items,it=>it.inject-it.actual,(it,v)=>{recordInjection(state.job.startedAt,v);it.actual+=v;barrel(it.id).lv-=v/barrel(it.id).cap*100;barrel(it.id).fert=it.inject-it.actual>1e-6;});j.elapsed+=dt;j.stageElapsed+=dt;left-=dt;if(stageRemaining()<1e-7)advanceStage();}}

function tick(seconds){if(state.locked)return;const purgeWasRunning=!!state.purge;const wasActive=!!(activeJob()||state.purge||manualBusy());const dt=seconds*state.speed;if(activeJob())tickJob(dt/60);else if(state.purge){state.purge.remaining-=seconds;if(state.purge.remaining<=0){endPurge('正常完成');if(state.modal?.type==='confirm-end-purge'){state.modal=null;render();toast('排气完成');return;}toast('排气完成');}}else{state.barrels.forEach(b=>{let purgeElapsed=dt;for(const k of ['mix','fert']){const d=b.delays[k];if(d){const before=d.remaining;d.remaining-=dt;if(d.remaining<=0){b.delays[k]=null;const e=canDevice(b,k);if(!e){if(k==='fert'){b.prePurge=30;purgeElapsed=Math.max(0,dt-before);}else b.mix=true;}else toast('延时启动取消：'+e);}}}if(b.prePurge){b.prePurge=Math.max(0,b.prePurge-purgeElapsed);if(!b.prePurge){const e=canDevice(b,'fert');if(!e)b.fert=true;else toast('排气后未启动：'+e);}}if(b.water&&b.sensor){b.lv=Math.min(b.enabled.max?b.rules.max:100,b.lv+dt/60*30/b.cap*100);if(b.enabled.max&&b.lv>=b.rules.max)b.water=false;}if(b.fert){if(!state.manualSession){state.manualTotal=0;state.manualSession={manual:true,startedAt:Date.now(),actual:0};}const floor=b.sensor&&b.enabled.min?b.rules.min:0;const v=b.sensor?Math.max(0,Math.min((b.lv-floor)/100*b.cap,dt/60*30)):dt/60*30;if(b.sensor)b.lv-=v/b.cap*100;recordInjection(state.manualSession.startedAt,v);state.manualTotal+=v;if(state.manualSession)state.manualSession.actual+=v;if(b.sensor&&b.enabled.min&&b.lv<=b.rules.min+1e-6)b.fert=false;}if(b.mix&&b.sensor&&b.enabled.mix&&b.lv<b.rules.mix)b.mix=false;});if(state.barrels.some(b=>b.fert)&&!state.manualSession)state.manualSession={manual:true,startedAt:Date.now(),actual:0};if(state.manualSession&&!state.barrels.some(b=>b.fert))endManual('注肥阀全部关闭');}if(state.page==='messages')return;if(wasActive||activeJob()||state.purge||manualBusy()||state.page==='run'||state.page==='purge'){if(['confirm-lock','confirm-estop'].includes(state.modal?.type)||(!state.lockedScreen&&(Date.now()<barrelScrollingUn function originalHandle(action,id,kind){const b=barrel(id);switch(action){case 'home':state.page='overview';state.modal=null;break;case 'setup':navigateSetup();return;case 'run':state.page='run';break;case 'detail':state.modal={type:'detail',id:+id};break;case 'rules':if(manualBusy()||activeJob())return toast('运行期间不能修改联锁设置');state.modal={type:'rules',id:+id};break;case 'close':state.modal=null;break;case 'amount':state.modal={type:'amount',id:+id};break;case 'save-amount':{const d={target:+$('#target-amount').value,inject:+$('#inject-amount').value},e=validDraft(+id,d);if(e)return modalError(e);state.draft[id]=d;state.modal=null;break;}case 'save-rules':{if(activeJob()||manualBusy())return modalError('请先停止任务与手动操作');const r={max:+$('#rule-max').value,mix:+$('#rule-mix').value,min:+$('#rule-min').value};if(Object.values(r).some(v=>!Number.isFinite(v)||v<0||v>100)||r.min>=r.mix||r.mix>=r.max||r.max<b.lv)return modalError('须满足：0 ≤ 施肥下限 < 搅拌下限 < 注水上限 ≤ 100，且注水上限不低于当前液位');b.rules=r;state.modal={type:'detail',id:+id};break;}case 'toggle-device':if(b[kind]){b[kind]=false;break;}else{const e=canDevice(b,kind);if(e)return toast(e);if(b.delay)return toast('请先取消该桶的延时任务');state.modal={type:'confirm-device',id:+id,kind};break;}case 'confirm-device':{const e=canDevice(b,kind);if(e)return toast(e);b[kind]=true;state.modal={type:'detail',id:+id};break;}case 'delay':state.modal={type:'delay',id:+id,kind};break;case 'save-delay':{const v=+$('#delay-minutes').value;if(!Number.isFinite(v)||v<1||v>60)return modalError('延时须为 1–60 分钟');const e=canDevice(b,kind);if(e)return modalError(e);b.delay={kind,remaining:v*60,at:Date.now()+v*60000};state.modal={type:'detail',id:+id};break;}case 'cancel-delay':b.delay=null;break;case 'review':{const e=validateSetup();if(e)return modalError(e);state.modal={type:'review'};break;}case 'start':beginJob();return;case 'stop-job':if(activeJob())finishJob('stopped','操作员手动停止');else{makePreviewResult();state.job.status='stopped';state.job.reason='操作员停止';state.p function handle(action,id,kind){
  const barrelState=['toggle-device','confirm-device'].includes(action)?barrel(id):null;
  const previousDevice=barrelState&&Boolean(barrelState[kind]);
  const previousLock=state.locked;
  const previousPurge=Boolean(state.purge);
  const previousJob=Boolean(activeJob());
  const previousPage=state.page;
  performDeviceAction(action,id,kind);

  const automatic=['setup','run','result'].includes(previousPage);
  const mode=automatic?'一键水肥':'手动水肥';
  const nextDevice=barrelState&&Boolean(barrelState[kind]);
  const deviceLabels={water:'注水阀',mix:'搅拌机',fert:'注肥阀'};
  if(barrelState&&deviceLabels[kind]&&previousDevice!==nextDevice){
    operationLog.add('施肥','肥料桶 '+barrelState.id+' · '+deviceLabels[kind],nextDevice?'关闭 → 开启':'开启 → 关闭',mode);
  }
  if((action==='confirm-estop'||action==='reset-lock')&&previousLock!==state.locked){
    operationLog.add('紧急',state.locked?'急停':'急停复位',state.locked?'关闭 → 开启':'开启 → 关闭',mode);
  }
  if((action==='start-purge'||action==='confirm-end-purge')&&previousPurge!==Boolean(state.purge)){
    operationLog.add('施肥','管道排气',state.purge?'关闭 → 开启':'开启 → 关闭',mode);
  }
  if((action==='start'||action==='stop-job')&&previousJob!==Boolean(activeJob())){
    operationLog.add('施肥','一键施肥',activeJob()?'启动任务':'停止任务','一键水肥');
  }
  if(action==='setup'&&!automatic&&state.page==='setup'){

    operationLog.add('其他','模式切换','一键水肥 → 手动水肥','手动水肥');

  }

    state.modal={type:'operation-filters',draft:operationLog.filters()};

    return;

  }

ite(min)||min<1||min>60)return modalError('延时须为 1–60 分钟');const e=canDevice(b,kind);if(e)return modalError(e);b.delays[kind]={kind,remaining:min*60,at:Date.now()+min*60000};state.inline=null;state.modal=null;render();return;}if(action==='cancel-delay'){if(kind)b.delays[kind]=null;else b.delays={mix:null,fert:null};state.inline=null;state.modal=null;render();return;}if(action==='cancel-prepurge'){b.prePurge=0;render();return;}if(action==='save-rules'){if(activeJob()||manualBusy())return modalError('请先停止当前动作');if(['max','mix','min'].some(k=>$('#rule-'+k).value.trim()===''))return modalError('请填写完整的联锁数值');const r={max:+$('#rule-max').value,mix:+$('#rule-mix').value,min:+$('#rule-min').value};if(Object.values(r).some(v=>!Number.isFinite(v)||v<0||v>100)||r.min>=r.mix||r.mix>=r.max)return modalError('须满足：施肥下限 < 搅拌下限 < 注水上限，范围 0–100%');if(r.max<b.lv)return modalError('注水上限不得低于当前液位');b.rules=r;b.enabled={max:$('#enable-max').checked,mix:$('#enable-mix').checked,min:$('#enable-min').checked};state.inline=null;state.modal=null;render();return;}if(action==='purge'){requestPurgeSwitch('purge');return;}if(action==='history'||action==='purge-history'){state.historyType=action==='purge-history'?'purge':'fert';state.page='history';state.modal=null;state.inline=null;render();return;}if(action==='start-purge'){if(state.locked||activeJob()||manualBusy())return toast('请先停止当前操作');state.purgeResult=null;state.purge={remaining:30,startedAt:Date.now()};render();return;}if(action==='stop-purge'){

function useTouchNumber(key){if(!touchNumber)return;const input=document.getElementById(touchNumber.id);if(!input||input.disabled){closeTouchNumber();return;}const output=$('.key-value'),error=$('.key-error'),panel=$('.touch-keyboard');if(key==='取消'){closeTouchNumber();input.focus({preventScroll:true});return;}if(key==='重输'){touchNumber.fresh=true;output.classList.add('replace-selected');return;}if(key==='确定'){const test=document.createElement('input');test.type='number';for(const attr of ['min','max','step'])if(input.hasAttribute(attr))test.setAttribute(attr,input.getAttribute(attr));test.value=touchNumber.value;if(!touchNumber.value||!test.checkValidity()){error.textContent='请输入 '+(input.min||0)+'–'+(input.max||'有效范围')+' 内的'+(test.validity.stepMismatch?'步进值':'数值');panel.classList.add('has-error');output.setAttribute('aria-invalid','true');touchNumber.fresh=true;output.classList.add('replace-selected');return;}input.value=touchNumber.value;closeTouchNumber();input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}));document.getElementById(input.id)?.focus({preventScroll:true});return;}error.textContent='';panel.classList.remove('has-error');output.removeAttribute('aria-invalid');if(key==='清空')touchNumber.value='';else if(key==='退格')touchNumber.value=touchNumber.value.slice(0,-1);else if(touchNumber.value.length<7||touchNumber.fresh)touchNumber.value=(touchNumber.fresh?'':touchNumber.value)+key;touchNumber.fresh=false;output.classList.remove('replace-selected');output.value=touchNumber.value;}
